<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Чек-лист электрики büro42</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;600&family=Golos+Text:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
body{margin:0}[hidden]{display:none!important}img{max-width:100%}

/* Layout: drafting-table app — rail of rooms on the left, a wall elevation (развёртка) beside its checklist, all on a faint drafting grid */
:root{
  --bg:#ECEEE6; --surface:#FBFBF7; --ink:#23251A; --muted:#66695A; --line:#D3D6C8; --grid:rgba(78,78,48,.07);
  --olive:#4E4E30; --olive-ink:#FBFBF7; --olive-soft:#E1E3D1; --coral:#D9534F; --coral-soft:#F9DEDA;
  --ok:#3F7D4E; --warn:#C98A1C; --crit:#C2453F;
  --f-display:"Jost","Futura","Century Gothic",sans-serif;
  --f-body:"Golos Text","Segoe UI",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#15160F; --surface:#1E2016; --ink:#E8E9DE; --muted:#A3A693; --line:#363929; --grid:rgba(200,202,160,.06);
  --olive:#B8BA86; --olive-ink:#17180F; --olive-soft:#2B2D1F; --coral:#FF8A85; --coral-soft:#3A2220;
  --ok:#7FC08E; --warn:#E3B055; --crit:#FF8A85; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#15160F; --surface:#1E2016; --ink:#E8E9DE; --muted:#A3A693; --line:#363929; --grid:rgba(200,202,160,.06);
  --olive:#B8BA86; --olive-ink:#17180F; --olive-soft:#2B2D1F; --coral:#FF8A85; --coral-soft:#3A2220;
  --ok:#7FC08E; --warn:#E3B055; --crit:#FF8A85; color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f-body);font-size:15px;line-height:1.5;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 40px}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--coral);outline-offset:2px}
.wrap{max-width:1240px;margin:0 auto}
header.top{display:flex;flex-wrap:wrap;align-items:center;gap:12px 24px;padding-block:20px 16px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:baseline;gap:14px;min-width:0}
.logo{font-family:var(--f-display);font-weight:300;font-size:28px;letter-spacing:.01em;line-height:1}
.logo b{font-weight:400;color:var(--coral)}
.brand h1{font-family:var(--f-display);font-weight:500;font-size:20px;margin:0;text-wrap:balance}
.proj{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-left:auto}
.proj label{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
select,input[type=text],input[type=number]{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:6px 10px;min-width:0}
select{max-width:240px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:6px 12px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--olive)}
.btn.primary{background:var(--olive);color:var(--olive-ink);border-color:var(--olive)}
.btn.danger{color:var(--crit)}
.btn.small{padding:3px 9px;font-size:13px}
.total{display:flex;align-items:center;gap:10px}
.total svg{display:block}
.total .num{font-family:var(--f-mono);font-size:13px;color:var(--muted)}
.store-note{font-size:12px;color:var(--muted);width:100%;text-align:right}
.layout{display:grid;grid-template-columns:250px minmax(0,1fr);gap:28px;padding-top:20px}
nav.rail{position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px);align-self:start;display:flex;flex-direction:column;gap:2px}
.rail h3{font-family:var(--f-display);font-weight:500;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:14px 10px 4px}
.rail h3:first-child{margin-top:0}
.rail a{display:grid;grid-template-columns:1fr auto;align-items:center;gap:2px 8px;padding:7px 10px;border-radius:6px;color:inherit;text-decoration:none}
.rail a:hover{background:var(--olive-soft)}
.rail a.on{background:var(--olive);color:var(--olive-ink)}
.rail a .cnt{font-family:var(--f-mono);font-size:12px;opacity:.75}
.rail a .bar{grid-column:1/-1;height:3px;border-radius:2px;background:var(--line);overflow:hidden}
.rail a .bar i{display:block;height:100%;background:var(--coral)}
.rail a.on .bar{background:rgba(255,255,255,.25)}
main{min-width:0}
.room-head{display:flex;flex-wrap:wrap;align-items:flex-end;gap:8px 20px;margin-bottom:14px}
.room-head h2{font-family:var(--f-display);font-weight:400;font-size:34px;line-height:1.1;margin:0;text-wrap:balance}
.room-head .lead{flex-basis:100%;display:flex;flex-direction:column;gap:6px}
.room-head .lead p{margin:0;color:var(--muted);max-width:62ch}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
.chip{border:1px solid var(--line);background:transparent;border-radius:999px;padding:4px 12px;font-size:13px;cursor:pointer}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.room-body{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:22px;align-items:start}
.room-body.nodraw{grid-template-columns:minmax(0,1fr)}
.sheet{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 14px 10px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px)}
.sheet .cap{display:flex;justify-content:space-between;gap:10px;font-size:12px;color:var(--muted);letter-spacing:.04em;margin-bottom:6px}
.sheet .cap b{font-family:var(--f-display);font-weight:500;font-size:13px;color:var(--ink);letter-spacing:.06em;text-transform:uppercase}
.drawing{background-color:var(--surface);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:18px 18px;border-radius:6px;overflow-x:auto}
.drawing svg{display:block;width:100%;height:auto;min-width:420px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted);margin-top:8px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.sym{cursor:pointer}
.sym .hit{fill:transparent}
.sym.hl .ring{stroke:var(--coral);stroke-width:2.5;fill:var(--coral-soft)}
.sym.done .mark{opacity:.45}
.elhl{stroke:var(--coral)!important}
ul.items{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.grp{font-family:var(--f-display);font-weight:500;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:14px 2px 2px}
.grp:first-child{margin-top:0}
li.it{display:grid;grid-template-columns:28px minmax(0,1fr);gap:4px 10px;padding:10px 12px;background:var(--surface);border:1px solid var(--line);border-radius:8px;transition:border-color .15s,background .15s}
li.it.hl{border-color:var(--coral);box-shadow:0 0 0 1px var(--coral)}
li.it.flash{animation:fl 1.2s ease}
@keyframes fl{0%{background:var(--coral-soft)}100%{background:var(--surface)}}
@media (prefers-reduced-motion:reduce){li.it.flash{animation:none}}
li.it.done{background:transparent}
li.it.done .txt{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--line)}
.cb{width:22px;height:22px;border:1.5px solid var(--olive);border-radius:5px;display:grid;place-items:center;cursor:pointer;background:transparent;padding:0;margin-top:1px}
.cb svg{opacity:0}
li.done .cb{background:var(--olive)}
li.done .cb svg{opacity:1}
.txt{min-width:0}
.meta{grid-column:2;display:flex;flex-wrap:wrap;gap:4px 6px;align-items:center}
.tag{font-size:11.5px;border-radius:4px;padding:1px 6px;background:var(--olive-soft);color:var(--ink);white-space:nowrap}
.tag.h{font-family:var(--f-mono);background:transparent;border:1px solid var(--line)}
.tag.must{background:var(--coral-soft);color:var(--coral);font-weight:600}
.tag.src{background:transparent;color:var(--muted);padding-left:0}
.kd{display:inline-block;width:14px;height:14px;vertical-align:-2px}
.empty{padding:20px;border:1px dashed var(--line);border-radius:8px;color:var(--muted);text-align:center}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;margin-top:18px}
.panel h4{font-family:var(--f-display);font-weight:500;font-size:16px;margin:0 0 8px}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-weight:500;color:var(--muted);font-size:12px;letter-spacing:.05em;text-transform:uppercase}
td.n{font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.tools{display:flex;flex-wrap:wrap;gap:8px;margin-top:22px;padding-top:16px;border-top:1px solid var(--line);align-items:center}
.tools .msg{font-size:13px;color:var(--muted)}
/* heights */
.ruler-wrap{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px;overflow-x:auto}
.ruler-wrap svg{display:block;width:100%;min-width:560px;height:auto}
/* load */
.calc{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:22px;align-items:start}
.app-row{display:grid;grid-template-columns:auto minmax(0,1fr) 70px 70px;gap:10px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line)}
.app-row input[type=number]{width:70px;padding:4px 6px;font-family:var(--f-mono);font-size:13px}
.app-row .pw{font-family:var(--f-mono);font-size:13px;text-align:right;color:var(--muted)}
.app-row .nm small{display:block;color:var(--muted);font-size:12px}
.sum{position:sticky;top:12px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px}
.big{font-family:var(--f-display);font-weight:300;font-size:46px;line-height:1}
.big small{font-size:18px;color:var(--muted)}
.meter{height:12px;border-radius:6px;background:var(--olive-soft);overflow:hidden;margin:12px 0 6px;position:relative}
.meter i{display:block;height:100%;border-radius:6px}
.kv{display:flex;justify-content:space-between;gap:10px;font-size:14px;padding:5px 0;border-bottom:1px dashed var(--line)}
.kv span:last-child{font-family:var(--f-mono)}
.note{font-size:13px;color:var(--muted);margin-top:10px}
.confirm{display:inline-flex;gap:6px;align-items:center;font-size:13px}

.levels{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:0 0 20px}
.lvcard{display:flex;flex-direction:column;gap:6px;text-align:left;line-height:1.45;background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:16px;cursor:pointer;transition:border-color .15s,box-shadow .15s}
.lvcard:hover{border-color:var(--olive)}
.lvcard.on{border-color:var(--olive);box-shadow:0 0 0 2px var(--olive)}
.lvdots{display:flex;gap:4px}.lvdots i{width:18px;height:6px;border-radius:3px;background:var(--line)}.lvdots i.f{background:var(--coral)}
.lvt{font-family:var(--f-display);font-size:22px;font-weight:500;line-height:1.1}
.lvs{font-size:13px;color:var(--olive);font-weight:600}
.lvd{font-size:14px;color:var(--muted);margin-bottom:4px}
.lvk{display:flex;justify-content:space-between;gap:10px;font-size:13px;border-top:1px dashed var(--line);padding-top:5px}
.lvk span{color:var(--muted)}.lvk b{font-weight:500;text-align:right}
.lvn{font-family:var(--f-mono);font-size:12px;color:var(--muted);margin-top:4px}
.lvcard.on .lvn{color:var(--coral)}
.info{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;border:1.5px solid var(--olive);background:transparent;color:var(--olive);font-family:var(--f-display);font-style:italic;font-weight:600;font-size:12px;line-height:1;cursor:pointer;padding:0;vertical-align:1px;margin-left:4px}
.info:hover,.info.on{background:var(--olive);color:var(--olive-ink)}
.expl{grid-column:2;background:var(--olive-soft);border-radius:8px;padding:10px 12px;font-size:14px;line-height:1.55;max-width:70ch}
svg.scheme{display:block;width:100%;min-width:600px;height:auto;font-family:var(--f-body)}
.scheme .nd{fill:var(--surface);stroke:var(--muted);stroke-width:1.2}
.scheme .nd.acc{fill:var(--olive-soft);stroke:var(--olive);stroke-width:1.6}
.scheme .nd.acc2{fill:var(--coral-soft);stroke:var(--coral)}
.scheme .nd.in{fill:var(--surface);stroke:var(--olive)}
.scheme .nd.warn{fill:var(--surface);stroke:var(--warn)}
.scheme .nt{font-size:14px;font-weight:600;fill:var(--ink)}
.scheme .ns{font-size:12px;fill:var(--muted)}
.scheme .ln-pow{stroke:var(--olive);stroke-width:3;fill:none}
.scheme .ln-low{stroke:var(--ink);stroke-width:1.5;fill:none}
.scheme .ln-net{stroke:var(--coral);stroke-width:2;fill:none;stroke-dasharray:7 4}
.scheme .ln-radio{stroke:var(--muted);stroke-width:1.4;fill:none;stroke-dasharray:2 4}
.scheme .ln-bus{stroke:var(--ok);stroke-width:3.5;fill:none}
.plan .room{fill:var(--surface);stroke:var(--ink);stroke-width:2}
.plan .rn{font-family:var(--f-display);font-size:14px;fill:var(--muted)}
.plan .it{font-size:9.5px;font-weight:600;stroke:none;fill:var(--ink)}
.plan g[class^="i-"]{stroke-width:1.8;fill:var(--surface)}
.plan .i-net{stroke:var(--coral)}.plan .i-net circle{fill:var(--coral)}
.plan .i-acc{stroke:var(--olive);fill:var(--olive-soft)}
.plan .i-warn{stroke:var(--warn)}.plan .i-warn path{fill:var(--warn);fill-opacity:.25}
.plan .i-crit{stroke:var(--crit)}
.plan .i-ink{stroke:var(--ink)}
@media (max-width:900px){.levels{grid-template-columns:minmax(0,1fr)}}

.lvwrap{display:flex;align-items:center;gap:8px}
.lvlab{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;padding:6px 12px;cursor:pointer;font-size:14px}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:var(--olive);color:var(--olive-ink)}
.start{max-width:1100px}
.eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--coral);margin:4px 0 6px}
.start h2{font-family:var(--f-display);font-weight:400;font-size:40px;line-height:1.1;margin:0 0 10px;text-wrap:balance}
.startlead{color:var(--muted);max-width:62ch;margin:0 0 22px}
.levels.big .lvcard{padding:20px}
.levels.big .lvt{font-size:28px}
.lvinc{margin:4px 0 8px;padding-left:18px;font-size:14px;display:flex;flex-direction:column;gap:4px}
.lvinc li::marker{color:var(--coral)}
.startgo{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin-top:6px}
.startgo .btn{text-decoration:none;padding:10px 18px}
.startgo .msg{font-size:14px;color:var(--muted)}

.olsum{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:18px 0}
.olsum div{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.olsum span{font-size:12px;color:var(--muted)}.olsum b{font-family:var(--f-display);font-weight:500;font-size:18px}
.olswrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:#fff;padding:6px}
.olswrap svg{display:block}
.rqs{display:flex;flex-wrap:wrap;gap:10px 18px}
.rq{display:flex;align-items:center;gap:8px;font-size:14px}
.rq input{width:64px;font-family:var(--f-mono)}
@media (max-width:980px){.room-body{grid-template-columns:minmax(0,1fr)}.sheet{position:static}.calc{grid-template-columns:minmax(0,1fr)}.sum{position:static}}
@media (max-width:760px){
  .layout{grid-template-columns:minmax(0,1fr);gap:14px}
  nav.rail{position:static;flex-direction:row;overflow-x:auto;gap:6px;padding-bottom:6px}
  .rail h3{display:none}
  .rail a{flex:0 0 auto;grid-template-columns:auto auto;border:1px solid var(--line)}
  .rail a .bar{display:none}
  .proj{margin-left:0;width:100%}
  .room-head h2{font-size:28px}
  .store-note{text-align:left}
  .app-row{grid-template-columns:auto minmax(0,1fr) 64px}
  .app-row .pw{display:none}
}
</style>

</head><body>
<div class="wrap">
  <header class="top">
    <div class="brand"><span class="logo">būro<b>42</b></span><h1>Чек-лист электрики</h1></div>
    <div class="lvwrap"><span class="lvlab">Уровень</span><span id="lvSwitch"></span></div>
    <div class="proj">
      <label for="projSel">Проект</label>
      <select id="projSel"></select>
      <span id="projActions"></span>
      <div class="total" title="Выполнено по проекту"><svg width="34" height="34" viewBox="0 0 36 36" aria-hidden="true"><circle cx="18" cy="18" r="15" fill="none" stroke="var(--line)" stroke-width="4"/><circle id="ring" cx="18" cy="18" r="15" fill="none" stroke="var(--coral)" stroke-width="4" stroke-linecap="round" stroke-dasharray="0 100" transform="rotate(-90 18 18)" pathLength="100"/></svg><span class="num" id="totalNum">0/0</span></div>
    </div>
    <div class="store-note" id="storeNote">Отметки сохраняются в этом браузере</div>
  </header>
  <div class="layout">
    <nav class="rail" id="rail" aria-label="Помещения"></nav>
    <main id="main"></main>
  </div>
</div>

<script>
/* ---------------- DATA ---------------- */
const SRC={ru:'норма РФ',intl:'зарубежный опыт',buro:'практика büro42'};
const KIND={s:'розетка 220 В',n:'интернет / слаботочка',o:'вывод кабеля',w:'выключатель',p:'силовая линия',l:'свет',x:'проверка'};

const ROOMS=[
{id:'general',grp:'Квартира',name:'Общие правила',lead:'Проверяют один раз на весь объект, до детализации по комнатам. Электрику расставляют только после утверждённой мебели и спецификации техники.',items:[
 {g:'Щит и группы',t:'Место электрощита и слаботочного щита указано на плане, доступ не загорожен мебелью, резерв 20–30% модулей',k:'o',m:1,s:'buro'},
 {t:'Разрешённая мощность квартиры известна и сверена с расчётом нагрузки (вкладка «Нагрузка»)',k:'x',m:1,s:'buro'},
 {t:'Освещение и розетки — разные группы',k:'x',m:1,s:'ru'},
 {t:'Отдельные линии на мощные приборы: варочная, духовой шкаф, ПММ, стиральная, сушильная, бойлер, кондиционер, тёплый пол',k:'p',m:1,s:'ru'},
 {t:'УЗО или АВДТ 30 мА на все розеточные группы',k:'x',m:1,s:'ru'},
 {t:'Реле напряжения (УЗИП) на вводе — защита техники от скачков',k:'x',m:0,s:'buro'},
 {g:'Кабель (медь, итог считает электрик)',t:'Освещение — 1,5 мм² на автомат 10 А',k:'x',m:1,s:'ru'},
 {t:'Розетки — 2,5 мм² на автомат 16 А',k:'x',m:1,s:'ru'},
 {t:'Варочная панель (1 фаза) — 6 мм² на автомат 32 А',k:'p',m:1,s:'ru'},
 {g:'Расстановка',t:'План розеток наложен на план мебели: ничего не попадает за шкафы, диваны, изголовья',k:'x',m:1,s:'buro'},
 {t:'Свободные стены: любая точка не дальше 1,8 м от розетки (правило NEC — удобная проверка)',k:'s',m:0,s:'intl'},
 {t:'Отступ от угла 15–35 см, от откоса двери 10–15 см',k:'x',m:0,s:'intl'},
 {t:'Розетки в блоке выровнены по одной оси; ритм совпадает с раскладкой плитки и панелей',k:'x',m:0,s:'buro'},

{id:'light',grp:'Квартира',name:'Освещение и управление',lead:'В каждой комнате — не меньше двух-трёх слоёв света на отдельных клавишах: общий, рабочий и акцентный. Это проще и дешевле, чем одна люстра с диммером.',table:'layers',items:[

{id:'smart',grp:'Квартира',name:'Умный дом',lead:'Состав системы зависит от уровня оснащения, выбранного вверху: «Минимум» — беспроводной умный дом, «Стандарт» — контроллер и реле в щите, «Максимум» — шина KNX. Нажмите «i», чтобы прочитать объяснение простым языком. Решение принимают до черновой электрики: беспроводную систему можно добавить потом, проводную — только пока стены открыты.',table:'smart',items:[
 {g:'Решение',t:'Уровень системы выбран вместе с клиентом до черновой электрики',k:'x',m:1,s:'buro',lv:[1,2,3],e:'Уровень определяет, сколько проводов нужно спрятать в стены. Беспроводные устройства можно купить и поставить после ремонта. Проводную систему — только пока стены не оштукатурены. Если отложить решение, потом придётся штробить готовую отделку.'},
 {t:'Выбрана экосистема: Алиса, Салют, Apple Home, Google Home или Home Assistant; совместимость устройств проверена до покупки',k:'x',m:1,s:'intl',lv:[1,2,3],e:'Экосистема — это приложение и голосовой помощник, через которые вы управляете домом. Устройства одного бренда не всегда работают с приложением другого. Стандарт Matter создан, чтобы техника разных производителей понимала друг друга: например, у Яндекса есть розетки и ленты с Matter, а хаб Сбера работает по Zigbee. Перед покупкой проверьте, что все устройства видны в выбранном приложении.'},
 {t:'Сценарии прописаны с клиентом: «ушёл из дома», «ночь», «кино», «протечка», «отъезд»',k:'x',m:1,s:'buro',lv:[1,2,3],e:'Сценарий — несколько действий одной командой. «Ушёл из дома»: гаснет свет, закрываются шторы, выключается кондиционер, но холодильник и роутер работают. Когда сценарии придуманы заранее, электрик сразу разводит нужные линии отдельно.'},
 {t:'Обычные выключатели продолжают работать: умные лампы и реле не оставят дом без света при сбое интернета',k:'w',m:1,s:'intl',lv:[1],e:'В простой системе умные лампы или маленькие реле за выключателем управляются через приложение. Важно, чтобы свет можно было включить и рукой, если пропал интернет или разрядился телефон.'},
 {t:'Свет включается кнопками даже без интернета: логика работает в контроллере, а не в облаке',k:'w',m:1,s:'intl',lv:[2,3],e:'Облако — это сервер производителя в интернете. Если управление идёт через него, при сбое связи кнопки перестают работать. Контроллер в щите обрабатывает команды прямо в квартире, поэтому свет включается всегда.'},
 {t:'Интегратор или наладчик системы выбран до черновой электрики и согласовал схему щита',k:'x',m:1,s:'buro',lv:[2,3],e:'Интегратор — специалист, который программирует умный дом. Ему нужна определённая разводка проводов. Если позвать его после ремонта, может оказаться, что провода проложены не так.'},
 {g:'Щит и проводка',t:'Нулевой провод и глубокие подрозетники (60 мм) во всех точках выключателей',k:'w',m:1,s:'intl',lv:[1,2,3],e:'Умному выключателю нужно постоянное питание. Для этого в коробку под ним заводят нулевой провод («ноль»). Без него многие модели не работают или вызывают мерцание светодиодных ламп. Глубокая коробка нужна, чтобы за выключателем поместилось реле.'},
 {t:'Место в щите под контроллер, реле, диммеры и блоки питания: +30–50% модулей или отдельный щит автоматизации',k:'o',m:1,s:'buro',lv:[2,3],e:'Реле — это электронный выключатель, который размещают в щите. Каждой группе света и штор нужно своё реле, поэтому щит получается заметно больше обычного. Под него заранее оставляют нишу в стене или шкафу.'},
 {t:'Каждая группа света и штор — своим кабелем до щита («звездой»), а не через выключатель',k:'p',m:1,s:'buro',lv:[2,3],e:'Обычно провод идёт от щита к лампе через выключатель. В умном доме каждую группу света ведут отдельным кабелем прямо в щит, где её включает реле. Тогда любую лампу можно включить кнопкой, голосом, датчиком или по расписанию.'},
 {t:'Кнопки вместо выключателей подключены слаботочным кабелем к контроллеру',k:'n',m:1,s:'buro',lv:[2],e:'Кнопка на стене не включает свет сама, а отправляет команду контроллеру. По ней идёт безопасное низкое напряжение, поэтому кабель тонкий. Одна кнопка может управлять несколькими группами света или сценарием.'},
 {t:'Шинный кабель KNX (J-Y(St)Y 2×2×0,8, зелёная оболочка) ко всем кнопкам, датчикам и терморегуляторам',k:'n',m:1,s:'intl',lv:[3],e:'KNX — международный стандарт проводного умного дома (ISO/IEC 14543-3, EN 50090). Все устройства соединены одним тонким кабелем — шиной — и «переговариваются» по нему. Устройства разных производителей совместимы, а система работает без центрального сервера.'},
 {t:'Светильники с цифровым управлением DALI — для плавного диммирования каждой группы',k:'l',m:0,s:'intl',lv:[3],e:'DALI — цифровой протокол для светильников. Каждый светильник или группу можно плавно притушить и включить в нужной яркости. К драйверам светильников идёт дополнительная пара проводов.'},
 {t:'Кабели управления проложены отдельно от силовых, промаркированы и занесены в кабельный журнал',k:'n',m:1,s:'ru',lv:[2,3],e:'Так требует ГОСТ Р 70300-2022 о кабелях умного дома. Силовой кабель может наводить помехи на слаботочный, поэтому их разносят. Маркировка и журнал нужны, чтобы через несколько лет мастер понял, какой провод куда идёт.'},
 {t:'Пустые гофры от щита в каждую комнату и к потолку — под будущие датчики и точки доступа',k:'o',m:0,s:'intl',lv:[1,2,3],e:'Гофра — пустая гибкая труба в стене. Через неё потом можно протянуть новый кабель без штробления. Это дешёвая страховка на будущее.'},
 {g:'Сеть',t:'Wi-Fi покрывает всю квартиру ровно: точки доступа на потолке подключены кабелем Cat6 с питанием PoE',k:'n',m:1,s:'intl',lv:[1,2,3],e:'Беспроводные устройства работают только при хорошем Wi-Fi. Одного роутера в прихожей часто мало. Точки доступа на потолке, подключённые кабелем, дают ровную связь во всех комнатах. PoE — питание по тому же сетевому кабелю, розетка у точки не нужна. Обычно хватает одной точки на 2–3 комнаты.'},
 {t:'Хаб или умная колонка-хаб стоит ближе к центру квартиры, рядом есть розетка',k:'s',m:1,s:'buro',lv:[1],e:'Хаб — небольшой блок, через который датчики на батарейках связываются с телефоном (по Zigbee или Thread). Если он стоит в дальнем углу, сигнал до части комнат не дойдёт.'},
 {t:'Cat6 к ТВ, рабочим местам, видеодомофону и камерам; сетевой шкаф в сухом вентилируемом месте',k:'n',m:1,s:'intl',lv:[2,3],e:'По кабелю интернет стабильнее и быстрее, чем по Wi-Fi. Всё сетевое оборудование собирают в одном шкафу, где ему не жарко и до него легко добраться.'},
 {t:'Видеодомофон с сетевым интерфейсом — открыть дверь и увидеть гостя со смартфона',k:'n',m:0,s:'ru',lv:[1,2,3],e:'Для многоквартирных домов такие домофоны описывает ГОСТ Р 71872-2024. В квартире к панели нужен сетевой кабель и розетка для блока питания.'},
 {g:'Безопасность и вода',t:'Защита от протечек: датчики на полу под ванной, мойкой, ПММ, стиральной и у коллектора; краны с электроприводом после ручных вводных кранов; модуль с ИБП',k:'x',m:1,s:'buro',lv:[1,2,3],e:'Датчик на полу замечает воду и за секунды перекрывает краны на вводе. Это самая окупаемая функция умного дома: залив соседей стоит дороже всей системы. Краны ставят после обычных вводных кранов, а не вместо них. Модулю нужна розетка и резервное питание, чтобы он сработал и при отключении света.'},
 {t:'Датчики дыма в коридоре и жилых комнатах; на кухне с газом — датчик утечки газа',k:'x',m:1,s:'ru',lv:[1,2,3],e:'Датчики дыма и газа входят в базовый набор умного дома по российским ГОСТам 2024 года. Умный датчик не только пищит, но и присылает уведомление на телефон, даже если дома никого нет.'},
 {t:'Умные счётчики воды и электроэнергии с передачей показаний',k:'x',m:0,s:'ru',lv:[2,3],e:'Показания уходят сами, а резкий рост расхода воды может подать сигнал о скрытой протечке. Для этого у счётчика должен быть импульсный или цифровой выход.'},
 {t:'Датчики открытия окон и входной двери',k:'x',m:0,s:'intl',lv:[1,2,3],e:'Подскажут, что окно осталось открытым перед уходом, и могут выключить кондиционер или отопление, пока проветривается комната.'},
 {g:'Комфорт',t:'Шторы: приводы на аккумуляторе или розетка у карниза',k:'s',m:0,s:'intl',lv:[1],e:'В простой системе подойдут приводы со встроенным аккумулятором — их заряжают раз в несколько месяцев. Если хочется без зарядки, у карниза нужна розетка, её прячут за шторой.'},
 {t:'Шторы и карнизы: питание 220 В и кабель управления у карниза, тип привода выбран до штукатурки',k:'o',m:1,s:'intl',lv:[2,3],e:'Проводной привод надёжнее и не требует зарядки, но кабель к нему нужно проложить заранее, до отделки. Тип привода влияет на то, какой провод тянуть, поэтому его выбирают на этапе проекта.'},
 {t:'Тёплый пол и радиаторы управляются терморегуляторами с Wi-Fi или от контроллера',k:'x',m:0,s:'buro',lv:[1,2,3],e:'Тогда пол можно прогреть к приходу домой или выключить на время отпуска. Датчик температуры пола укладывают в гофре, чтобы его можно было заменить.'},
 {t:'Кондиционеры: Wi-Fi модуль, ИК-шлюз или проводной интерфейс к контроллеру',k:'x',m:0,s:'intl',lv:[1,2,3],e:'Многие кондиционеры уже умеют работать через приложение. Если нет, подойдёт ИК-шлюз — он «нажимает» кнопки пульта. В проводной системе используют интерфейс, который советует поставщик кондиционера.'},
 {t:'Датчики движения в коридоре, санузлах и гардеробной',k:'x',m:0,s:'intl',lv:[1,2,3],e:'Свет включается сам, когда вы входите, и гаснет, когда уходите. Особенно удобно ночью и с полными руками.'},
 {t:'Датчики CO₂ и влажности в спальнях и детской связаны с бризером или вентиляцией',k:'x',m:0,s:'intl',lv:[2,3],e:'Когда в спальне душно, датчик CO₂ сам включает приток свежего воздуха. Хороший воздух ночью заметно влияет на сон.'},
 {t:'Встроенная акустика по комнатам (мультирум) — кабели от усилителя к каждой зоне',k:'o',m:0,s:'intl',lv:[3],e:'Мультирум — музыка, которая играет в разных комнатах из одного источника. Акустику встраивают в потолок, а кабели от усилителя прокладывают на этапе черновых работ.'},
 {g:'Надёжность',t:'ИБП для роутера, хаба или контроллера и модуля протечек',k:'p',m:1,s:'buro',lv:[1,2,3],e:'ИБП — источник бесперебойного питания с аккумулятором. При коротком отключении электричества умный дом не перезагружается, а защита от протечек продолжает работать.'},
 {t:'Постоянно включённые линии (холодильник, котёл, роутер, защита от протечек) не отключаются сценарием «ушёл из дома»',k:'p',m:1,s:'buro',lv:[2,3],e:'Сценарий «выключить всё» не должен выключать то, что обязано работать всегда. Такие линии в щите выделяют отдельно.'},
 {t:'Реле в щите с ручным переключателем — свет можно включить при отказе контроллера',k:'x',m:0,s:'buro',lv:[2,3],e:'Если контроллер сломался, электрик или сам владелец включит нужные линии прямо в щите, не дожидаясь ремонта.'},
 {t:'Клиенту переданы схема щита, список устройств, логины и инструкция по ручному управлению',k:'x',m:1,s:'buro',lv:[1,2,3],e:'Через несколько лет никто не вспомнит, какое реле за что отвечает. Документы позволят любому мастеру быстро разобраться и что-то поменять.'}
]},
{id:'public',grp:'Общественные',name:'Общественные помещения',lead:'К удобству добавляются обязательные нормы: освещённость рабочих мест, аварийный свет, пожарная сигнализация. Электропроект делает проектировщик с допуском; дизайнер готовит задание по этому списку.',table:'lux',items:[
 {g:'Офис и переговорные',t:'Рабочие места: лючки в полу или силовые колонны, по 4 × 220 В + 2 RJ45 на место',k:'s',q:6,m:1,s:'buro'},
 {t:'Переговорная: лючок в столе (220 В, HDMI/USB-C), питание панели и камеры на стене, диммер для видеосвязи',k:'s',m:1,s:'intl'},
 {g:'Кафе и ресторан',t:'Сцены света «день / вечер»; управление светом зала из служебной зоны',k:'l',m:1,s:'buro'},
 {t:'Розетки у барной стойки, диванов, витрин, кассы; фоновая музыка',k:'s',m:0,s:'buro'},
 {t:'Кухня: трёхфазное оборудование, выводы по технологическому заданию, IP44 и выше',k:'p',m:1,s:'ru'},

let saveT=null,saving=false,pending=false;
function queueSave(){clearTimeout(saveT);saveT=setTimeout(flush,600)}
async function flush(){
  if(saving){pending=true;return}
  saving=true;const p=curP();p.updated=Date.now();
  try{await store.save(JSON.parse(JSON.stringify(p)))}catch(e){setNote('Не удалось сохранить: '+(e&&e.code||'ошибка')+'. Отметки останутся до перезагрузки.')}
  saving=false;if(pending){pending=false;flush()}
}
function setNote(t){document.getElementById('storeNote').textContent=t}

async function initDb(){
  if(!window.claude||!window.claude.use)return;
  try{
    const [db,user]=await Promise.all([claude.use('db'),claude.use('user')]);
    if(!db||!user)return;
    const id=await user.id(); if(!id)return;
    const col=db.collection('data/users/'+id);
    const snap=await col.get();
    let list=snap.docs.filter(d=>d.exists).map(d=>JSON.parse(JSON.stringify(d.data())));
    const dbStore={mode:'db',async save(p){await col.doc(p.id).set(p)},async remove(pid){await col.doc(pid).delete()}};
    if(!list.length){
      const local=S.projects.filter(p=>p.id!=='example'||Object.keys(p.checks).length);
      list=local.length?local:[exampleProject()];
      for(const p of list){try{await dbStore.save(p)}catch(e){return}}
    }
    store=dbStore;
    const keep=S.cur;
    S.projects=list.sort((a,b)=>(b.updated||0)-(a.updated||0));
    S.cur=S.projects.some(p=>p.id===keep)?keep:S.projects[0].id;
    setNote('Проекты и отметки сохраняются в вашем аккаунте — видны только вам');
    renderAll();
  }catch(e){}
}

function drawWall(r){
  const W=r.wall, H=W.h, fs=(W.w+80)/30, rr=fs*.42;
  const Y=h=>H-h;
  const p=curP();
  let g='';
  const tones={crit:'var(--crit)',warn:'var(--warn)',warn2:'var(--warn)',ok:'var(--ok)'};
  const ops={crit:.22,warn:.16,warn2:.07,ok:.07};
  // wall outline
  if(!W.zones) g+=`<rect x="0" y="0" width="${W.w}" height="${H}" fill="none" stroke="var(--line)" stroke-width="1" vector-effect="non-scaling-stroke"/>`;
  for(const e of W.els){
    if(e.t==='zone'){g+=`<rect x="${e.x}" y="${Y(e.y+e.h)}" width="${e.w}" height="${e.h}" fill="${tones[e.tone]}" fill-opacity="${ops[e.tone]}" stroke="${e.nob?'none':tones[e.tone]}" vector-effect="non-scaling-stroke"/>`;
      g+=`<text x="${e.x+e.w/2}" y="${Y(e.ly)}" text-anchor="middle" font-weight="600" font-size="${fs}" fill="var(--ink)">${esc(e.label)}</text>`;
      if(e.sub)g+=`<text x="${e.x+e.w/2}" y="${Y(e.ly)+fs*1.3}" text-anchor="middle" font-size="${fs*.85}" fill="var(--muted)">${esc(e.sub)}</text>`;}
  }
  for(const e of W.els){
    if(e.t==='box'){g+=`<rect x="${e.x}" y="${Y(e.y+e.h)}" width="${e.w}" height="${e.h}" fill="${e.acc?'var(--coral-soft)':'none'}" stroke="${e.acc?'var(--coral)':'var(--muted)'}" stroke-width="1" vector-effect="non-scaling-stroke"/>`;
      if(e.label){const lx=e.lx??(e.x+e.w/2),ly=e.ly??(e.y+e.h/2);const f=Math.min(fs*(e.fs||.9),(e.lx!=null?e.w*1.2:e.w*.92)/(e.label.length*.56));g+=`<text x="${lx}" y="${Y(ly)+f*.35}" text-anchor="middle" font-size="${f}" fill="var(--muted)">${esc(e.label)}</text>`}}
    else if(e.t==='vl')g+=`<line x1="${e.x}" x2="${e.x}" y1="${Y(e.y1)}" y2="${Y(e.y2)}" stroke="var(--muted)" vector-effect="non-scaling-stroke"/>`;
    else if(e.t==='hl')g+=`<line x1="${e.x1}" x2="${e.x2}" y1="${Y(e.y)}" y2="${Y(e.y)}" stroke="var(--line)" vector-effect="non-scaling-stroke"/>`;
    else if(e.t==='top')g+=`<line x1="${e.x1}" x2="${e.x2}" y1="${Y(e.y)}" y2="${Y(e.y)}" stroke="var(--muted)" stroke-width="3" vector-effect="non-scaling-stroke"/>`;
    else if(e.t==='hob')g+=`<line x1="${e.x1}" x2="${e.x2}" y1="${Y(e.y)}" y2="${Y(e.y)}" stroke="var(--olive)" stroke-width="3" vector-effect="non-scaling-stroke"/>`;
    else if(e.t==='led'&&!BYID[e.item].lv.includes(curLevel())){}
    else if(e.t==='led')g+=`<g class="sym${p.checks[e.item]?' done':''}" data-item="${e.item}" tabindex="0" role="button" aria-label="${esc(BYID[e.item].t)}"><line x1="${e.x1}" x2="${e.x2}" y1="${Y(e.y)}" y2="${Y(e.y)}" stroke="transparent" stroke-width="${fs}"/><line class="ring mark" x1="${e.x1}" x2="${e.x2}" y1="${Y(e.y)}" y2="${Y(e.y)}" stroke="var(--coral)" stroke-width="2.2" stroke-dasharray="6 4" vector-effect="non-scaling-stroke"/></g>`;
    else if(e.t==='cable')g+=`<g class="sym${p.checks[e.item]?' done':''}" data-item="${e.item}" tabindex="0" role="button" aria-label="${esc(BYID[e.item].t)}"><line x1="${e.x}" x2="${e.x}" y1="${Y(e.y1)}" y2="${Y(e.y2)}" stroke="transparent" stroke-width="${fs}"/><line class="ring mark" x1="${e.x}" x2="${e.x}" y1="${Y(e.y1)}" y2="${Y(e.y2)}" stroke="var(--coral)" stroke-width="2.2" stroke-dasharray="5 4" vector-effect="non-scaling-stroke"/></g>`;
    else if(e.t==='dim'){g+=`<line x1="${e.x1}" x2="${e.x2}" y1="${Y(e.y)}" y2="${Y(e.y)}" stroke="var(--muted)" vector-effect="non-scaling-stroke"/><line x1="${e.x1}" x2="${e.x1}" y1="${Y(e.y)-4}" y2="${Y(e.y)+4}" stroke="var(--muted)" vector-effect="non-scaling-stroke"/><line x1="${e.x2}" x2="${e.x2}" y1="${Y(e.y)-4}" y2="${Y(e.y)+4}" stroke="var(--muted)" vector-effect="non-scaling-stroke"/><text x="${(e.x1+e.x2)/2}" y="${Y(e.y)+fs*1.3}" text-anchor="middle" font-size="${fs*.85}" fill="var(--muted)">${esc(e.label)}</text>`}
  }
  // floor + ruler
  g+=`<line x1="-30" x2="${W.w+20}" y1="${H}" y2="${H}" stroke="var(--ink)" stroke-width="1.4" vector-effect="non-scaling-stroke"/>`;
  for(let h=50;h<=H;h+=50){g+=`<line x1="-8" x2="0" y1="${Y(h)}" y2="${Y(h)}" stroke="var(--muted)" vector-effect="non-scaling-stroke"/><text x="-11" y="${Y(h)+fs*.33}" text-anchor="end" font-family="var(--f-mono)" font-size="${fs*.72}" fill="var(--muted)">${h}</text>`}
  g+=`<line x1="0" x2="0" y1="0" y2="${H}" stroke="var(--muted)" vector-effect="non-scaling-stroke"/>`;
  // symbols
  r.items.forEach((it,idx)=>{ if(!it.p||!it.lv.includes(curLevel()))return;
    let s='';
    it.p.forEach(pt=>{const [x,h,kk]=pt;const k=kk||it.k;const cx=x,cy=Y(h);
      if(k==='n')s+=`<path class="ring" d="M${cx} ${cy-rr*1.25}l${rr*1.25} ${rr*1.25}l${-rr*1.25} ${rr*1.25}l${-rr*1.25} ${-rr*1.25}z" fill="var(--surface)" stroke="var(--coral)" stroke-width="1.6" vector-effect="non-scaling-stroke"/>`;
      else if(k==='o')s+=`<rect class="ring" x="${cx-rr}" y="${cy-rr}" width="${rr*2}" height="${rr*2}" fill="var(--surface)" stroke="var(--ink)" stroke-width="1.6" vector-effect="non-scaling-stroke"/>`;
      else if(k==='w')s+=`<rect class="ring" x="${cx-rr*.35}" y="${cy-rr*1.4}" width="${rr*.7}" height="${rr*2.8}" fill="var(--ink)" stroke="var(--ink)" vector-effect="non-scaling-stroke"/>`;
      else if(k==='p')s+=`<circle class="ring" cx="${cx}" cy="${cy}" r="${rr}" fill="var(--olive)" stroke="var(--olive)" stroke-width="1.6" vector-effect="non-scaling-stroke"/>`;
      else s+=`<circle class="ring" cx="${cx}" cy="${cy}" r="${rr}" fill="var(--surface)" stroke="var(--ink)" stroke-width="1.6" vector-effect="non-scaling-stroke"/>`;
      s+=`<circle class="hit" cx="${cx}" cy="${cy}" r="${rr*2}"/>`;
    });
    // number badge near first point
    const [bx,bh]=it.p[0];
    const num=idx+1;
    s+=`<g class="mark"><text x="${bx}" y="${Y(bh)-rr*1.9}" text-anchor="middle" font-family="var(--f-mono)" font-size="${fs*.72}" font-weight="500" fill="var(--coral)">${num}</text></g>`;
    g+=`<g class="sym${p.checks[it.id]?' done':''}" data-item="${it.id}" tabindex="0" role="button" aria-label="${esc(it.t)}">${s}</g>`;
  });
  const vbX=-50, vbY=-fs*2.2, vbW=W.w+80, vbH=H+fs*2.2+(W.zones?fs*3:fs*1.4);
  return `<svg viewBox="${vbX} ${vbY} ${vbW} ${vbH}" font-family="var(--f-body)" role="img" aria-label="${esc(W.title)}">${g}</svg>`;
}

async function dlSave(filename,data){const m=$('#toolMsg');let dl=null;try{dl=window.claude&&await claude.use('downloads')}catch(e){}

  try{await dl.save({filename,data});m.textContent='Файл сохранён'}catch(e){m.textContent=e&&e.code==='declined'?'Сохранение отменено':'Не удалось сохранить файл'}}

function toolsHTML(){return `<div class="tools"><button class="btn" id="copyOpen">Скопировать незакрытые пункты</button><button class="btn" id="csvBtn">Выгрузить точки в CSV</button><button class="btn" id="resetRoom">Снять отметки в помещении</button><span class="msg" id="toolMsg"></span></div>`}

function renderHeights(){
  const pts=ALL.filter(i=>i.h!=null&&i.lv.includes(curLevel())).map(i=>({...i,rn:ROOMS.find(r=>r.id===i.room).name}));
  const levels={};pts.forEach(i=>(levels[i.h]=levels[i.h]||[]).push(i));
  const hs=Object.keys(levels).map(Number).sort((a,b)=>a-b);
  // layout rows with min spacing
  const top=30,scale=2.6,floor=top+250*scale;
  let lastY=Infinity;const rows=hs.slice().reverse().map(h=>{let y=floor-h*scale;return {h,y}});
  // resolve label overlaps (labels go down from top)
  let prev=-Infinity;rows.sort((a,b)=>a.y-b.y).forEach(r=>{r.ly=Math.max(r.y,prev+22);prev=r.ly});
  const H=Math.max(floor+30,prev+30);
  let g='';
  for(let h=0;h<=250;h+=10){const y=floor-h*scale;const maj=h%50===0;g+=`<line x1="${maj?84:92}" x2="100" y1="${y}" y2="${y}" stroke="var(--muted)"/>`;if(maj)g+=`<text x="78" y="${y+4}" text-anchor="end" font-family="var(--f-mono)" font-size="12" fill="var(--muted)">${h}</text>`}
  g+=`<line x1="100" x2="100" y1="${floor-250*scale}" y2="${floor}" stroke="var(--muted)"/><line x1="20" x2="1000" y1="${floor}" y2="${floor}" stroke="var(--ink)" stroke-width="1.4"/><text x="110" y="${floor+20}" font-size="12" fill="var(--muted)">чистовой пол</text>`;
  g+=`<rect x="100" y="${floor-100*scale}" width="22" height="${20*scale}" fill="var(--coral)" fill-opacity=".14"/><text x="111" y="${floor-90*scale+4}" text-anchor="middle" font-size="9" fill="var(--coral)" transform="rotate(-90 111 ${floor-90*scale})">выкл.</text>`;
  for(const r of rows){
    const its=levels[r.h];const names=[...new Set(its.map(i=>i.rn))];
    const short=its.map(i=>i.t.split(/[:—(,]/)[0].trim()).filter((v,i,a)=>a.indexOf(v)===i).slice(0,3).join(' · ');
    g+=`<path d="M100 ${r.y} H140 L160 ${r.ly} H170" fill="none" stroke="var(--line)"/><circle cx="140" cy="${r.y}" r="4.5" fill="var(--surface)" stroke="var(--coral)" stroke-width="1.6"/>`;
    g+=`<text x="176" y="${r.ly+4}" font-family="var(--f-mono)" font-size="13" font-weight="500" fill="var(--ink)">${r.h}</text>`;
    g+=`<text x="222" y="${r.ly+4}" font-size="13" fill="var(--ink)">${esc(short.length>78?short.slice(0,76)+'…':short)}</text>`;
    g+=`<text x="1000" y="${r.ly+4}" text-anchor="end" font-size="11.5" fill="var(--muted)">${esc(names.join(', '))}</text>`;
  }
  $('#main').innerHTML=`<div class="room-head"><h2>Шкала высот</h2><div class="lead"><p>Все высоты из чек-листа на одной линейке: от чистового пола до оси розетки, в сантиметрах. Розовая полоса — зона выключателей 80–100 см.</p></div></div><div class="ruler-wrap"><svg viewBox="0 0 1020 ${H}" font-family="var(--f-body)" role="img" aria-label="Шкала высот розеток">${g}</svg></div>
  <div class="panel"><h4>Все пункты с высотой</h4><div class="tbl"><table><thead><tr><th>см</th><th>Помещение</th><th>Пункт</th></tr></thead><tbody>${pts.sort((a,b)=>a.h-b.h).map(i=>`<tr><td class="n">${i.h}</td><td>${esc(i.rn)}</td><td>${esc(i.t)}</td></tr>`).join('')}</tbody></table></div></div>${toolsHTML()}`;
}

function renderLoad(){
  const p=curP();p.calc=p.calc||{};APPLIANCES.forEach(a=>{if(p.calc[a.id]==null)p.calc[a.id]=a.def});
  const rows=APPLIANCES.map(a=>`<div class="app-row"><input type="number" min="0" max="20" step="1" id="q-${a.id}" data-q="${a.id}" value="${p.calc[a.id]}" aria-label="Количество: ${esc(a.n)}"><div class="nm">${esc(a.n)}<small>${a.line?'отдельная линия':'розеточная группа'}</small></div><div class="pw">${a.kw.toFixed(2)} кВт</div><div class="pw" id="s-${a.id}">${(a.kw*p.calc[a.id]).toFixed(1)}</div></div>`).join('');
  $('#main').innerHTML=`<div class="room-head"><h2>Нагрузка</h2><div class="lead"><p>Быстрая прикидка: хватит ли выделенной мощности и сколько отдельных линий заложить. Укажите количество приборов — сумма пересчитается. Это ориентир для разговора с электриком, не проектный расчёт.</p></div></div>
  <div class="calc"><div class="panel" style="margin-top:0">${rows}</div>
  <div class="sum" id="sum"></div></div><div class="startgo" style="margin-top:18px"><a class="btn primary" href="#scheme">Построить однолинейную схему →</a></div>${toolsHTML()}`;
  updSum();
}
function updSum(){
  const p=curP();let inst=0,lines=0;APPLIANCES.forEach(a=>{const q=+p.calc[a.id]||0;inst+=a.kw*q;if(a.line)lines+=q>0?(a.id==='floor'||a.id==='ac'?q:1):0;const s=document.getElementById('s-'+a.id);if(s)s.textContent=(a.kw*q).toFixed(1)});
  const kc=inst>14?0.45:inst>8?0.55:0.65;const est=inst*kc;const lim=+p.limit||15;const pct=Math.min(est/lim,1.3);
  const col=est<=lim*.8?'var(--ok)':est<=lim?'var(--warn)':'var(--crit)';
  const verdict=est<=lim*.8?'Запас есть':est<=lim?'На пределе — согласуйте с электриком':'Не хватает — нужна разгрузка или увеличение мощности';
  const sockets=Math.max(2,Math.ceil(ROOMS.filter(r=>r.grp==='Квартира'&&r.wall).length/2)+1);
  $('#sum').innerHTML=`<div style="font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)">Расчётная нагрузка</div>
  <div class="big">${est.toFixed(1)} <small>кВт</small></div>
  <div class="meter"><i style="width:${Math.min(pct,1)*100}%;background:${col}"></i></div>
  <div style="font-weight:500;color:${col}">${verdict}</div>
  <div style="margin-top:14px">
  <div class="kv"><span>Установленная мощность</span><span>${inst.toFixed(1)} кВт</span></div>
  <div class="kv"><span>Коэфф. одновременности</span><span>${kc.toFixed(2)}</span></div>
  <div class="kv"><span><label for="lim">Выделенная мощность, кВт</label></span><span><input type="number" id="lim" min="3" max="50" step="0.5" value="${lim}" style="width:76px;font-family:var(--f-mono)"></span></div>
  <div class="kv"><span>Отдельных силовых линий</span><span>${lines}</span></div>
  <div class="kv"><span>Розеточных групп (ориентир)</span><span>${sockets}–${sockets+2}</span></div>
  <div class="kv"><span>Групп освещения (ориентир)</span><span>2–4</span></div></div>
  <p class="note">Коэффициент одновременности взят упрощённо: чем больше установленная мощность, тем меньше приборов работает одновременно. Итоговую схему щита, автоматы и сечения подбирает электрик по ПУЭ и СП 256.</p>`;
}

function renderAll(){
  renderProj();renderTotal();renderRail();
  $('#lvSwitch').innerHTML=levelSwitch();
  if(S.view==='start')renderStart();else if(S.view==='scheme')renderScheme();else if(S.view==='heights')renderHeights();else if(S.view==='load')renderLoad();
  else{const r=ROOMS.find(x=>x.id===S.view)||ROOMS[0];renderRoom(r)}
}

/* ---------------- EVENTS ---------------- */
function route(){const h=(location.hash||'').slice(1);S.view=(ROOMS.some(r=>r.id===h)||h==='heights'||h==='load'||h==='start'||h==='scheme')?h:'start';renderAll();}
window.addEventListener('hashchange',()=>{route();window.scrollTo({top:0})});

function setHL(id,on){document.querySelectorAll(`[data-item="${CSS.escape(id)}"]`).forEach(el=>el.classList.toggle('hl',on))}
document.addEventListener('mouseover',e=>{const t=e.target.closest('[data-item]');if(t)setHL(t.dataset.item,true)});
document.addEventListener('mouseout',e=>{const t=e.target.closest('[data-item]');if(t&&!t.contains(e.relatedTarget))setHL(t.dataset.item,false)});
document.addEventListener('focusin',e=>{const t=e.target.closest('.sym');if(t)setHL(t.dataset.item,true)});
document.addEventListener('focusout',e=>{const t=e.target.closest('.sym');if(t)setHL(t.dataset.item,false)});

function toggle(id){const p=curP();if(p.checks[id])delete p.checks[id];else p.checks[id]=true;queueSave();
  const y=window.scrollY;renderRail();renderTotal();if(S.view!=='heights'&&S.view!=='load'&&S.view!=='start'&&S.view!=='scheme'){renderRoom(ROOMS.find(r=>r.id===S.view));}window.scrollTo({top:y});
  const li=document.querySelector(`li.it[data-item="${CSS.escape(id)}"] .cb`);if(li)li.focus({preventScroll:true});}
function jump(id){const li=document.querySelector(`li.it[data-item="${CSS.escape(id)}"]`);if(!li){S.filter='all';renderRoom(ROOMS.find(r=>r.id===S.view));return jump(id)}
  li.scrollIntoView({block:'center',behavior:matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth'});li.classList.remove('flash');void li.offsetWidth;li.classList.add('flash')}

document.addEventListener('click',async e=>{
  const tg=e.target.closest('[data-tg]');if(tg){toggle(tg.dataset.tg);return}
  const inf=e.target.closest('[data-info]');if(inf){const id=inf.dataset.info;S.open[id]=!S.open[id];const ex=document.getElementById('ex-'+id);if(ex)ex.hidden=!S.open[id];inf.setAttribute('aria-expanded',!!S.open[id]);inf.classList.toggle('on',!!S.open[id]);return}
  const lvb=e.target.closest('[data-lv]');if(lvb){const p=curP();p.level=+lvb.dataset.lv;queueSave();const y=window.scrollY;renderAll();window.scrollTo({top:y});return}
  const sym=e.target.closest('.sym');if(sym){jump(sym.dataset.item);return}
  const f=e.target.closest('[data-f]');if(f){S.filter=f.dataset.f;renderRoom(ROOMS.find(r=>r.id===S.view));return}
  const id=e.target.id;
  if(id==='newOk')return createProj();
  if(id==='newNo'){S.newMode=false;renderProj();return}
  if(id==='delBtn'){S.delMode=true;renderProj();return}
  if(id==='delNo'){S.delMode=false;renderProj();return}
  if(id==='delOk'){const p=curP();S.projects=S.projects.filter(x=>x.id!==p.id);S.cur=S.projects[0].id;S.delMode=false;try{await store.remove(p.id)}catch(err){}renderAll();return}
  if(id==='svgBtn')return exportSvg();
  if(id==='olsCsv')return exportOlsCsv();
  if(id==='copyOpen')return copyOpen();
  if(id==='csvBtn')return exportCsv();
  if(id==='resetRoom')return resetRoom(e.target);
});
document.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&e.target.id==='newName')createProj();
  if(e.key==='Escape'&&(S.newMode||S.delMode)){S.newMode=S.delMode=false;renderProj()}
  const sym=e.target.closest&&e.target.closest('.sym');if(sym&&(e.key==='Enter'||e.key===' ')){e.preventDefault();jump(sym.dataset.item)}
});
document.addEventListener('change',e=>{
  if(e.target.id==='projSel'){if(e.target.value==='__new'){S.newMode=true;renderProj();return}S.cur=e.target.value;S.newMode=S.delMode=false;renderAll();}
});
document.addEventListener('input',e=>{
  const q=e.target.dataset&&e.target.dataset.q;const p=curP();
  if(q){p.calc[q]=Math.max(0,Math.min(20,+e.target.value||0));updSumSoft();queueSave();}
  const rm=e.target.dataset&&e.target.dataset.rm;if(rm){const R=schemeRooms(p);R[rm]=Math.max(0,Math.min(+e.target.max||4,+e.target.value||0));queueSave();clearTimeout(S.rmT);S.rmT=setTimeout(()=>{const y=window.scrollY;const f=document.activeElement&&document.activeElement.id;renderScheme();window.scrollTo({top:y});if(f){const el=document.getElementById(f);el&&el.focus()}},350);}
  if(e.target.id==='lim'){p.limit=+e.target.value||10;updSumSoft(true);queueSave();}
});
function updSumSoft(keepLim){const f=document.activeElement&&document.activeElement.id;updSum();if(f==='lim'){const i=$('#lim');i.focus();const v=i.value;i.value='';i.value=v}}

function createProj(){const n=($('#newName')||{}).value;const name=(n||'').trim()||'Новый проект';const calc={};APPLIANCES.forEach(a=>calc[a.id]=a.def);
  const p={id:uid(),name:name.slice(0,80),checks:{},calc,limit:15,updated:Date.now()};S.projects.unshift(p);S.cur=p.id;S.newMode=false;renderAll();queueSave()}

function openLines(){const p=curP();const out=[];ROOMS.forEach(r=>{const o=visItems(r).filter(i=>!p.checks[i.id]);if(o.length){out.push(r.name.toUpperCase());o.forEach(i=>out.push('☐ '+i.t+(i.h!=null?` (${i.h} см)`:'')+(i.m?' — обязательно':'')));out.push('')}});return out.join('\n')}
async function copyOpen(){const txt=`${curP().name} — незакрытые пункты\n\n`+openLines();const m=$('#toolMsg');
  try{await navigator.clipboard.writeText(txt);m.textContent='Скопировано в буфер обмена'}catch(e){const ta=document.createElement('textarea');ta.value=txt;ta.style.cssText='width:100%;height:160px;margin-top:8px';m.textContent='Не удалось скопировать автоматически — выделите текст ниже:';m.after(ta);ta.select()}}
async function exportCsv(){const p=curP();const m=$('#toolMsg');
  const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"';
  const rows=[['Помещение','№','Пункт','Высота, см','Кол-во','Тип','Обязательно','Источник','Отмечено'].map(q).join(';')];
  ROOMS.forEach(r=>visItems(r).forEach((i,ix)=>rows.push([r.name,ix+1,i.t,i.h??'',i.q??'',KIND[i.k],i.m?'да':'',SRC[i.s],p.checks[i.id]?'да':''].map(q).join(';'))));
  const data='﻿'+rows.join('\r\n');
  return dlSave(`электрика — ${p.name}.csv`,data);}
function resetRoom(btn){const m=$('#toolMsg');if(!btn.dataset.sure){btn.dataset.sure='1';btn.textContent='Точно снять все отметки?';btn.classList.add('danger');return}
  const p=curP();const scope=ROOMS.find(r=>r.id===S.view);const ids=scope?scope.items.map(i=>i.id):ALL.map(i=>i.id);ids.forEach(i=>delete p.checks[i]);queueSave();renderAll();$('#toolMsg').textContent=scope?'Отметки в помещении сняты':'Все отметки сняты'}

/* ---------------- BOOT ---------------- */
(function(){const st=document.createElement('style');st.textContent=OLS_CSS;document.head.appendChild(st)})();
(function boot(){
  const local=loadLocal();S.projects=local.length?local.sort((a,b)=>(b.updated||0)-(a.updated||0)):[exampleProject()];
  S.cur=S.projects[0].id;route();initDb();
})();
</script>

</body></html>
