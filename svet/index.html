<style>
body{margin:0}[hidden]{display:none!important}img{max-width:100%}

/* Layout: single-page calculator — inputs left, result card and plan right, method and analogs below */
:root{
  --bg:#ECEEE6; --surface:#FBFBF7; --ink:#23251A; --muted:#66695A; --line:#D3D6C8; --grid:rgba(78,78,48,.07);
  --olive:#4E4E30; --olive-ink:#FBFBF7; --olive-soft:#E1E3D1; --coral:#D9534F; --coral-soft:#F9DEDA;
  --ok:#3F7D4E; --warn:#C98A1C; --crit:#C2453F;
  --f-display:"Jost","Futura","Century Gothic",sans-serif;
  --f-body:"Golos Text","Segoe UI",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#15160F; --surface:#1E2016; --ink:#E8E9DE; --muted:#A3A693; --line:#363929; --grid:rgba(200,202,160,.06);
  --olive:#B8BA86; --olive-ink:#17180F; --olive-soft:#2B2D1F; --coral:#FF8A85; --coral-soft:#3A2220;
  --ok:#7FC08E; --warn:#E3B055; --crit:#FF8A85; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#15160F; --surface:#1E2016; --ink:#E8E9DE; --muted:#A3A693; --line:#363929; --grid:rgba(200,202,160,.06);
  --olive:#B8BA86; --olive-ink:#17180F; --olive-soft:#2B2D1F; --coral:#FF8A85; --coral-soft:#3A2220;
  --ok:#7FC08E; --warn:#E3B055; --crit:#FF8A85; color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f-body);font-size:15px;line-height:1.5;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 40px}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--coral);outline-offset:2px}
.wrap{max-width:1240px;margin:0 auto}
header.top{display:flex;flex-wrap:wrap;align-items:center;gap:12px 24px;padding-block:20px 16px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:baseline;gap:14px;min-width:0}
.logo{font-family:var(--f-display);font-weight:300;font-size:28px;letter-spacing:.01em;line-height:1}
.logo b{font-weight:400;color:var(--coral)}
.brand h1{font-family:var(--f-display);font-weight:500;font-size:20px;margin:0;text-wrap:balance}
.proj{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-left:auto}
.proj label{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
select,input[type=text],input[type=number]{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:6px 10px;min-width:0}
select{max-width:240px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:6px 12px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--olive)}
.btn.primary{background:var(--olive);color:var(--olive-ink);border-color:var(--olive)}
.btn.danger{color:var(--crit)}

.total{display:flex;align-items:center;gap:10px}
.total svg{display:block}
.total .num{font-family:var(--f-mono);font-size:13px;color:var(--muted)}
.store-note{font-size:12px;color:var(--muted);width:100%;text-align:right}
.layout{display:grid;grid-template-columns:250px minmax(0,1fr);gap:28px;padding-top:20px}
nav.rail{position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px);align-self:start;display:flex;flex-direction:column;gap:2px}
.rail h3{font-family:var(--f-display);font-weight:500;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:14px 10px 4px}
.rail h3:first-child{margin-top:0}
.rail a{display:grid;grid-template-columns:1fr auto;align-items:center;gap:2px 8px;padding:7px 10px;border-radius:6px;color:inherit;text-decoration:none}
.rail a:hover{background:var(--olive-soft)}
.rail a.on{background:var(--olive);color:var(--olive-ink)}
.rail a .cnt{font-family:var(--f-mono);font-size:12px;opacity:.75}
.rail a .bar{grid-column:1/-1;height:3px;border-radius:2px;background:var(--line);overflow:hidden}
.rail a .bar i{display:block;height:100%;background:var(--coral)}
.rail a.on .bar{background:rgba(255,255,255,.25)}
main{min-width:0}
.room-head{display:flex;flex-wrap:wrap;align-items:flex-end;gap:8px 20px;margin-bottom:14px}
.room-head h2{font-family:var(--f-display);font-weight:400;font-size:34px;line-height:1.1;margin:0;text-wrap:balance}
.room-head .lead{flex-basis:100%;display:flex;flex-direction:column;gap:6px}
.room-head .lead p{margin:0;color:var(--muted);max-width:62ch}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
.chip{border:1px solid var(--line);background:transparent;border-radius:999px;padding:4px 12px;font-size:13px;cursor:pointer}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.room-body{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:22px;align-items:start}
.room-body.nodraw{grid-template-columns:minmax(0,1fr)}
.sheet{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 14px 10px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px)}
.sheet .cap{display:flex;justify-content:space-between;gap:10px;font-size:12px;color:var(--muted);letter-spacing:.04em;margin-bottom:6px}
.sheet .cap b{font-family:var(--f-display);font-weight:500;font-size:13px;color:var(--ink);letter-spacing:.06em;text-transform:uppercase}
.drawing{background-color:var(--surface);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:18px 18px;border-radius:6px;overflow-x:auto}
.drawing svg{display:block;width:100%;height:auto;min-width:420px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted);margin-top:8px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.sym{cursor:pointer}
.sym .hit{fill:transparent}
.sym.hl .ring{stroke:var(--coral);stroke-width:2.5;fill:var(--coral-soft)}
.sym.done .mark{opacity:.45}
.elhl{stroke:var(--coral)!important}
ul.items{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.grp{font-family:var(--f-display);font-weight:500;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:14px 2px 2px}
.grp:first-child{margin-top:0}
li.it{display:grid;grid-template-columns:28px minmax(0,1fr);gap:4px 10px;padding:10px 12px;background:var(--surface);border:1px solid var(--line);border-radius:8px;transition:border-color .15s,background .15s}
li.it.hl{border-color:var(--coral);box-shadow:0 0 0 1px var(--coral)}
li.it.flash{animation:fl 1.2s ease}
@keyframes fl{0%{background:var(--coral-soft)}100%{background:var(--surface)}}
@media (prefers-reduced-motion:reduce){li.it.flash{animation:none}}

.cb svg{opacity:0}

.txt{min-width:0}
.meta{grid-column:2;display:flex;flex-wrap:wrap;gap:4px 6px;align-items:center}

.tag.h{font-family:var(--f-mono);background:transparent;border:1px solid var(--line)}

.tag.src{background:transparent;color:var(--muted);padding-left:0}
.kd{display:inline-block;width:14px;height:14px;vertical-align:-2px}
.empty{padding:20px;border:1px dashed var(--line);border-radius:8px;color:var(--muted);text-align:center}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;margin-top:18px}
.panel h4{font-family:var(--f-display);font-weight:500;font-size:16px;margin:0 0 8px}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:top}

.tools{display:flex;flex-wrap:wrap;gap:8px;margin-top:22px;padding-top:16px;border-top:1px solid var(--line);align-items:center}
.tools .msg{font-size:13px;color:var(--muted)}
/* heights */
.ruler-wrap{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px;overflow-x:auto}
.ruler-wrap svg{display:block;width:100%;min-width:560px;height:auto}
/* load */
.calc{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:22px;align-items:start}
.app-row{display:grid;grid-template-columns:auto minmax(0,1fr) 70px 70px;gap:10px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line)}
.app-row input[type=number]{width:70px;padding:4px 6px;font-family:var(--f-mono);font-size:13px}
.app-row .pw{font-family:var(--f-mono);font-size:13px;text-align:right;color:var(--muted)}
.app-row .nm small{display:block;color:var(--muted);font-size:12px}
.sum{position:sticky;top:12px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px}
.big{font-family:var(--f-display);font-weight:300;font-size:46px;line-height:1}
.big small{font-size:18px;color:var(--muted)}
.meter{height:12px;border-radius:6px;background:var(--olive-soft);overflow:hidden;margin:12px 0 6px;position:relative}
.meter i{display:block;height:100%;border-radius:6px}
.kv{display:flex;justify-content:space-between;gap:10px;font-size:14px;padding:5px 0;border-bottom:1px dashed var(--line)}
.kv span:last-child{font-family:var(--f-mono)}
.note{font-size:13px;color:var(--muted);margin-top:10px}
.confirm{display:inline-flex;gap:6px;align-items:center;font-size:13px}


.lxgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px;align-items:start}
.fg{display:flex;flex-direction:column;gap:4px;min-width:0;margin-bottom:8px}
.fg label{font-size:12px;color:var(--muted)}
.fg input,.fg select{width:100%;max-width:none;font-family:var(--f-body)}
.fg input[type=number]{font-family:var(--f-mono)}
.fr{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fr3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;padding:6px 12px;cursor:pointer;font-size:14px}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:var(--olive);color:var(--olive-ink)}
.lxnorm{margin:2px 0 10px;flex-wrap:wrap}
.lxsum{position:static}
.lxfx{margin-top:12px;font-family:var(--f-mono);font-size:12.5px;background:var(--olive-soft);border-radius:6px;padding:8px 10px;overflow-x:auto;white-space:nowrap}
svg.lxplan{display:block;width:100%;max-width:560px;height:auto;min-width:300px;font-family:var(--f-body)}
.lx-room{fill:var(--surface);stroke:var(--ink);stroke-width:3}
.lx-glow{fill:var(--warn);fill-opacity:.13}
.lx-lum{fill:var(--surface);stroke:var(--ink);stroke-width:1.6}
.lx-x{stroke:var(--ink);stroke-width:1.3}
.lx-d{font-size:13px;fill:var(--ink);font-family:var(--f-mono)}
.lx-s{font-size:12px;fill:var(--muted)}
.lxsteps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;font-size:14px;max-width:80ch}
main.solo{padding-top:22px}
.foot{margin-top:28px;padding-top:14px;border-top:1px solid var(--line);font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:6px 18px}
.foot a{color:inherit}
@media (max-width:980px){.lxgrid{grid-template-columns:minmax(0,1fr)}}
@media (max-width:520px){.fr3{grid-template-columns:1fr 1fr}}
</style>

<div class="wrap">

<script>
const $=s=>document.querySelector(s);
/* ---------------- LIGHTING CALCULATOR ---------------- */
const LX_ROOMS=[
 {id:'living',n:'Гостиная, спальня',ru:150,en:200,des:'150–300',wp:0,k:'2700–3000 K',cri:'≥ 90',ugr:'—',note:'Общий свет 150 лк + торшер или бра для чтения 300–500 лк локально.'},
 {id:'kitchen',n:'Кухня',ru:150,en:300,des:'300–500 на столешнице',wp:0.85,k:'3000–4000 K',cri:'≥ 90',ugr:'—',note:'Норма РФ на полу; для рабочей зоны дизайнеры закладывают подсветку под шкафами 300–500 лк.'},
 {id:'kids',n:'Детская',ru:200,en:300,des:'300–500 на столе',wp:0,k:'3000 / 4000 K для уроков',cri:'≥ 90',ugr:'≤ 19',note:'Стол школьника — 300–500 лк от настольной лампы.'},
 {id:'office_home',n:'Домашний кабинет',ru:300,en:500,des:'500 на столе',wp:0.75,k:'4000 K',cri:'≥ 80',ugr:'≤ 19',note:'Свет на лицо спереди для видеозвонков.'},
 {id:'bath',n:'Ванная, санузел',ru:50,en:200,des:'200 у зеркала',wp:0,k:'3000–4000 K',cri:'≥ 90',ugr:'—',note:'У зеркала — 300–500 лк на лицо, без теней сверху.'},
 {id:'hall',n:'Прихожая, коридор',ru:50,en:100,des:'100–150',wp:0,k:'3000 K',cri:'≥ 80',ugr:'—',note:'У зеркала в прихожей — вертикальная подсветка.'},
 {id:'wardrobe',n:'Гардеробная',ru:75,en:200,des:'200–300',wp:0,k:'3000–4000 K',cri:'≥ 90',ugr:'—',note:'Высокий CRI — чтобы различать цвета одежды.'},
 {id:'office',n:'Офис, open space',ru:300,en:500,des:'500',wp:0.8,k:'4000 K',cri:'≥ 80',ugr:'≤ 19',note:'СП 52: 300 лк при работе с ПК; EN 12464-1: 500 лк для письма и чтения.'},
 {id:'meeting',n:'Переговорная',ru:300,en:500,des:'500, с диммером',wp:0.8,k:'3000–4000 K',cri:'≥ 80',ugr:'≤ 19',note:'Цилиндрическая освещённость лиц важна для видеосвязи.'},
 {id:'cafe',n:'Кафе, ресторан (зал)',ru:200,en:200,des:'100–300 по сценам',wp:0.8,k:'2700–3000 K',cri:'≥ 90',ugr:'≤ 22',note:'Сцены день / вечер; акцент на столы.'},
 {id:'shop',n:'Магазин, торговый зал',ru:300,en:300,des:'300–500 + акцент ×3–5',wp:0.8,k:'3000–4000 K',cri:'≥ 90',ugr:'≤ 22',note:'Акцентный свет на товар в 3–5 раз ярче общего.'},
 {id:'beauty',n:'Салон красоты, рабочее место',ru:500,en:500,des:'750 у кресла',wp:0.8,k:'4000 K',cri:'≥ 90',ugr:'≤ 19',note:'Высокий CRI обязателен для работы с цветом.'},
 {id:'class',n:'Учебный класс',ru:400,en:500,des:'500',wp:0.8,k:'4000 K',cri:'≥ 80',ugr:'≤ 19',note:'Доска — отдельная подсветка 500 лк.'},
 {id:'corr_pub',n:'Коридор общественный',ru:75,en:100,des:'100–150',wp:0,k:'3000–4000 K',cri:'≥ 80',ugr:'≤ 25',note:'Пути эвакуации — аварийный свет ≥ 1 лк.'}
];
const LX_LUM=[
 {id:'spot',n:'Точечный спот (даунлайт)',f:1.05,lm:450,w:6},
 {id:'panel',n:'LED-панель / встраиваемый',f:1.0,lm:3600,w:36},
 {id:'track',n:'Трековый светильник',f:1.0,lm:1800,w:20},
 {id:'surface',n:'Накладной потолочный',f:0.95,lm:2500,w:28},
 {id:'pendant',n:'Подвес, люстра (рассеянный)',f:0.82,lm:2000,w:22},
 {id:'line',n:'Линейный (профиль)',f:0.95,lm:1200,w:12},
 {id:'cove',n:'Подсветка в нише (отражённый)',f:0.5,lm:800,w:10}
];
const LX_SURF={c:[['Белый',0.8],['Светлый',0.7],['Средний',0.5],['Тёмный',0.3]],w:[['Светлые',0.5],['Средние',0.3],['Тёмные',0.1]],f:[['Светлый',0.3],['Средний',0.2],['Тёмный',0.1]]};
/* Utilization factor for ceiling-mounted direct luminaires (CIE/BZ-type tables), reflectance sets ρc/ρw/ρf */
const UF_I=[0.6,0.8,1.0,1.25,1.5,2.0,2.5,3.0,4.0,5.0];
const UF_T={
 '0.8/0.5':[0.40,0.48,0.54,0.59,0.63,0.69,0.73,0.76,0.80,0.82],
 '0.7/0.5':[0.37,0.45,0.51,0.56,0.60,0.66,0.70,0.73,0.77,0.79],
 '0.7/0.3':[0.31,0.39,0.45,0.50,0.54,0.61,0.65,0.69,0.73,0.76],
 '0.5/0.3':[0.29,0.36,0.42,0.47,0.51,0.57,0.61,0.64,0.69,0.72],
 '0.5/0.1':[0.24,0.31,0.37,0.42,0.46,0.52,0.57,0.60,0.65,0.68],
 '0.3/0.1':[0.22,0.29,0.34,0.39,0.43,0.49,0.53,0.57,0.62,0.65]
};
function ufLookup(i,rc,rw,rf){
  const keys=Object.keys(UF_T).map(k=>{const [c,w]=k.split('/').map(Number);return {k,c,w,d:Math.abs(c-rc)*1.2+Math.abs(w-rw)}}).sort((a,b)=>a.d-b.d);
  const row=UF_T[keys[0].k];const ii=Math.max(UF_I[0],Math.min(UF_I.at(-1),i));
  let j=UF_I.findIndex(x=>x>=ii);if(j<=0)j=1;const t=(ii-UF_I[j-1])/(UF_I[j]-UF_I[j-1]);
  let u=row[j-1]+(row[j]-row[j-1])*t;
  u*=1+(rf-0.2)*0.25; // floor reflectance correction (tables are for 0.2)
  return u;
}
function lxDefault(){return {room:'living',norm:'ru',E:150,a:5,b:4,h:2.7,wp:0,hang:0,rc:0.7,rw:0.5,rf:0.2,lum:'spot',lm:450,w:6,mf:0.8,z:1}}
const LXKEY='buro42-lux-v1';let LXS=null;
function lxState(){if(!LXS){let o={};try{o=JSON.parse(localStorage.getItem(LXKEY)||'{}')}catch(e){}LXS=Object.assign(lxDefault(),o)}return LXS}
function queueSave(){try{localStorage.setItem(LXKEY,JSON.stringify(LXS))}catch(e){}}
function lxCalc(s){
  const S=s.a*s.b;const hp=Math.max(0.3,s.h-s.wp-s.hang);const i=S/(hp*(s.a+s.b));
  const L=LX_LUM.find(x=>x.id===s.lum)||LX_LUM[0];
  const uf=Math.min(0.95,ufLookup(i,s.rc,s.rw,s.rf)*L.f);
  const Kz=1/s.mf;const Ftot=s.E*S*Kz*s.z/uf;const N=Math.max(1,Math.ceil(Ftot/s.lm));
  // grid
  let best=null;for(let r=1;r<=N;r++){const c=Math.ceil(N/r);const sx=s.a/c,sy=s.b/r;const sc=Math.abs(sx-sy)+(r*c-N)*0.3;if(!best||sc<best.sc)best={r,c,sc,sx,sy}}
  const Nl=best.r*best.c;const Eact=Nl*s.lm*uf/(S*Kz*s.z);
  const Pw=Nl*s.w;const pd=Pw/S;const smax=Math.max(best.sx,best.sy);const ratio=smax/hp;
  return {S,hp,i,uf,Kz,Ftot,N,Nl,rows:best.r,cols:best.c,sx:best.sx,sy:best.sy,Eact,Pw,pd,eff:s.lm/s.w,ratio};
}
function lxPlan(s,R){
  const W=520,pad=40;const sc=(W-2*pad)/Math.max(s.a,s.b);const w=s.a*sc,h=s.b*sc;const H=h+2*pad+20;
  let g=`<defs><clipPath id="lxclip"><rect x="${pad}" y="${pad}" width="${w}" height="${h}"/></clipPath></defs><rect x="${pad}" y="${pad}" width="${w}" height="${h}" class="lx-room"/><g clip-path="url(#lxclip)">`;
  // isolux-ish glow
  for(let r=0;r<R.rows;r++)for(let c=0;c<R.cols;c++){const x=pad+(c+0.5)*R.sx*sc,y=pad+(r+0.5)*R.sy*sc;
    g+=`<circle cx="${x}" cy="${y}" r="${Math.min(R.sx,R.sy)*sc*0.75}" class="lx-glow"/>`}
  g+='</g>';
  for(let r=0;r<R.rows;r++)for(let c=0;c<R.cols;c++){const x=pad+(c+0.5)*R.sx*sc,y=pad+(r+0.5)*R.sy*sc;
    g+=`<circle cx="${x}" cy="${y}" r="7" class="lx-lum"/><path d="M${x-5} ${y-5}L${x+5} ${y+5}M${x+5} ${y-5}L${x-5} ${y+5}" class="lx-x"/>`}
  // dims
  g+=`<text x="${pad+w/2}" y="${pad-14}" text-anchor="middle" class="lx-d">${s.a.toFixed(2)} м</text><text x="${pad-14}" y="${pad+h/2}" text-anchor="middle" class="lx-d" transform="rotate(-90 ${pad-14} ${pad+h/2})">${s.b.toFixed(2)} м</text>`;
  if(R.cols>1)g+=`<text x="${pad+R.sx*sc}" y="${pad+h+18}" text-anchor="middle" class="lx-s">шаг ${R.sx.toFixed(2)} м · от стены ${(R.sx/2).toFixed(2)} м</text>`;
  else g+=`<text x="${pad+w/2}" y="${pad+h+18}" text-anchor="middle" class="lx-s">по центру · от стены ${(R.sx/2).toFixed(2)} м</text>`;
  return `<svg viewBox="0 0 ${W} ${H}" class="lxplan" role="img" aria-label="Раскладка светильников">${g}</svg>`;
}
function renderLux(){
  const s=lxState();const R=lxCalc(s);const room=LX_ROOMS.find(r=>r.id===s.room)||LX_ROOMS[0];
  const opt=(arr,val)=>arr.map(([t,v])=>`<option value="${v}"${Math.abs(v-val)<1e-6?' selected':''}>${t} · ${Math.round(v*100)}%</option>`).join('');
  const ok=R.Eact>=s.E*0.95;const over=R.Eact>s.E*1.4;
  const st=ok?(over?['warn','С запасом — можно диммировать или убрать светильники']:['ok','Норма выполнена']):['crit','Не хватает света'];
  const ratioWarn=R.ratio>1.5?`<p class="note" style="color:var(--warn)">Шаг между светильниками больше 1,5 высоты подвеса — между ними будут тёмные пятна. Добавьте светильников меньшей мощности.</p>`:'';
  $('#main').innerHTML=`<div class="room-head"><h2>Сколько нужно светильников</h2><div class="lead"><p>Метод коэффициента использования светового потока — тот же, что в СП 52.13330 и в предварительном расчёте DIALux и Relux. Подходит для прямоугольных помещений с равномерной сеткой светильников; точность ±15%. Для сдачи проекта проверяйте результат в DIALux evo.</p></div></div>
  <div class="lxgrid">
   <div class="panel" style="margin-top:0"><h4>1. Помещение</h4>
    <div class="fg"><label for="lx-room">Тип</label><select id="lx-room" data-lx="room">${LX_ROOMS.map(r=>`<option value="${r.id}"${r.id===s.room?' selected':''}>${r.n}</option>`).join('')}</select></div>
    <div class="seg lxnorm" role="radiogroup" aria-label="Норма">${[['ru',`СП 52 · ${room.ru} лк`],['en',`EN 12464 · ${room.en} лк`],['own','Своя']].map(([k,t])=>`<button data-lxnorm="${k}" class="${s.norm===k?'on':''}" role="radio" aria-checked="${s.norm===k}">${t}</button>`).join('')}</div>
    <div class="fr"><div class="fg"><label for="lx-E">Норма, лк</label><input type="number" id="lx-E" data-lx="E" value="${s.E}" min="10" max="2000" step="10"${s.norm!=='own'?' readonly':''}></div>
    <div class="fg"><label for="lx-wp">Рабочая плоскость, м</label><input type="number" id="lx-wp" data-lx="wp" value="${s.wp}" min="0" max="1.2" step="0.05"></div></div>
    <div class="fr3"><div class="fg"><label for="lx-a">Длина, м</label><input type="number" id="lx-a" data-lx="a" value="${s.a}" min="1" max="50" step="0.1"></div>
    <div class="fg"><label for="lx-b">Ширина, м</label><input type="number" id="lx-b" data-lx="b" value="${s.b}" min="1" max="50" step="0.1"></div>
    <div class="fg"><label for="lx-h">Высота, м</label><input type="number" id="lx-h" data-lx="h" value="${s.h}" min="2" max="10" step="0.05"></div></div>
    <h4 style="margin-top:14px">2. Отделка</h4>
    <div class="fr3"><div class="fg"><label for="lx-rc">Потолок</label><select id="lx-rc" data-lx="rc">${opt(LX_SURF.c,s.rc)}</select></div>
    <div class="fg"><label for="lx-rw">Стены</label><select id="lx-rw" data-lx="rw">${opt(LX_SURF.w,s.rw)}</select></div>
    <div class="fg"><label for="lx-rf">Пол</label><select id="lx-rf" data-lx="rf">${opt(LX_SURF.f,s.rf)}</select></div></div>
    <h4 style="margin-top:14px">3. Светильник</h4>
    <div class="fg"><label for="lx-lum">Тип</label><select id="lx-lum" data-lx="lum">${LX_LUM.map(l=>`<option value="${l.id}"${l.id===s.lum?' selected':''}>${l.n}</option>`).join('')}</select></div>
    <div class="fr3"><div class="fg"><label for="lx-lm">Поток, лм</label><input type="number" id="lx-lm" data-lx="lm" value="${s.lm}" min="50" max="30000" step="50"></div>
    <div class="fg"><label for="lx-w">Мощность, Вт</label><input type="number" id="lx-w" data-lx="w" value="${s.w}" min="1" max="500" step="1"></div>
    <div class="fg"><label for="lx-hang">Свес, м</label><input type="number" id="lx-hang" data-lx="hang" value="${s.hang}" min="0" max="3" step="0.05"></div></div>
    <h4 style="margin-top:14px">4. Условия</h4>
    <div class="fr"><div class="fg"><label for="lx-mf">Эксплуатация</label><select id="lx-mf" data-lx="mf">${[['Чистое, Кз 1,25',0.8],['Обычное, Кз 1,4',0.7],['Пыльное, Кз 1,7',0.6]].map(([t,v])=>`<option value="${v}"${v===s.mf?' selected':''}>${t}</option>`).join('')}</select></div>
    <div class="fg"><label for="lx-z">Неравномерность Z</label><select id="lx-z" data-lx="z">${[['1,0 — EN',1],['1,1 — РФ, LED',1.1],['1,15 — РФ, лампы',1.15]].map(([t,v])=>`<option value="${v}"${v===s.z?' selected':''}>${t}</option>`).join('')}</select></div></div>
   </div>
   <div>
    <div class="sum lxsum"><div style="font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)">Нужно светильников</div>
     <div class="big">${R.Nl} <small>шт · ${R.rows} × ${R.cols}</small></div>
     <div class="meter"><i style="width:${Math.min(R.Eact/s.E,1.5)/1.5*100}%;background:var(--${st[0]==='crit'?'crit':st[0]==='warn'?'warn':'ok'})"></i></div>
     <div style="font-weight:500;color:var(--${st[0]})">${st[1]}: ${Math.round(R.Eact)} лк при норме ${s.E} лк</div>
     <div style="margin-top:12px">
      <div class="kv"><span>Площадь</span><span>${R.S.toFixed(1)} м²</span></div>
      <div class="kv"><span>Расчётная высота h</span><span>${R.hp.toFixed(2)} м</span></div>
      <div class="kv"><span>Индекс помещения i</span><span>${R.i.toFixed(2)}</span></div>
      <div class="kv"><span>Коэфф. использования η</span><span>${R.uf.toFixed(2)}</span></div>
      <div class="kv"><span>Нужный поток Φ</span><span>${Math.round(R.Ftot).toLocaleString('ru-RU')} лм</span></div>
      <div class="kv"><span>Мощность</span><span>${R.Pw} Вт · ${R.pd.toFixed(1)} Вт/м²</span></div>
      <div class="kv"><span>Светоотдача</span><span>${Math.round(R.eff)} лм/Вт</span></div>
     </div>
     <div class="lxfx">Φ = E · S · Kз · Z / η = ${s.E} · ${R.S.toFixed(1)} · ${R.Kz.toFixed(2)} · ${s.z} / ${R.uf.toFixed(2)}</div>
    </div>
    <div class="panel"><h4>Раскладка светильников</h4><div class="tbl">${lxPlan(s,R)}</div>${ratioWarn}</div>
    <div class="panel"><h4>Рекомендации · ${room.n}</h4>
     <div class="kv"><span>СП 52 / СанПиН (РФ)</span><span>${room.ru} лк</span></div>
     <div class="kv"><span>EN 12464-1 / зарубежная практика</span><span>${room.en} лк</span></div>
     <div class="kv"><span>Практика дизайнеров</span><span>${room.des} лк</span></div>
     <div class="kv"><span>Цветовая температура</span><span>${room.k}</span></div>
     <div class="kv"><span>Цветопередача Ra (CRI)</span><span>${room.cri}</span></div>
     <div class="kv"><span>Ослеплённость UGR</span><span>${room.ugr}</span></div>
     <p class="note">${room.note}</p></div>
   </div>
  </div>
  <div class="panel"><h4>Как считает калькулятор</h4>
   <ol class="lxsteps"><li><b>Индекс помещения</b> i = a·b / (h·(a+b)), где h — высота от рабочей плоскости до светильника.</li>
   <li><b>Коэффициент использования η</b> — доля потока, дошедшая до рабочей плоскости. Берётся по таблицам для потолочных светильников прямого света по i и отражениям потолка, стен и пола, с поправкой на тип светильника.</li>
   <li><b>Коэффициент запаса Kз = 1 / MF</b> — учитывает старение светодиодов и загрязнение (в EN это maintenance factor).</li>
   <li><b>Z</b> — отношение средней освещённости к минимальной; в российской методике 1,1–1,15, в EN — 1 (нормируется средняя).</li>
   <li><b>Количество</b> N = Φ / Φ₁, раскладка — сетка с шагом, близким к квадрату, и отступом от стен в половину шага.</li></ol>
   <p class="note">Не учитываются: дневной свет, мебель и перегородки, светильники с узкой кривой силы света (акцентные споты 24–36°), сложная форма помещения. Для таких задач — DIALux evo или Relux.</p></div>
  <div class="panel"><h4>Аналоги</h4><div class="tbl"><table><thead><tr><th>Программа</th><th>Что делает</th><th>Когда нужна</th></tr></thead><tbody>
   <tr><td><b>DIALux evo</b></td><td>3D-расчёт по фотометрии IES/LDT из каталогов производителей, визуализация, отчёты по EN 12464</td><td>Сдача проекта, общественные помещения, сложная форма</td></tr>
   <tr><td><b>Relux</b></td><td>Аналог DIALux: 3D-расчёт, базы светильников, дневной свет</td><td>То же, удобнее для некоторых каталогов</td></tr>
   <tr><td><b>AGi32</b></td><td>Профессиональный точный расчёт (платный)</td><td>Сложные проекты, наружное освещение</td></tr>
   <tr><td><b>Онлайн-калькуляторы</b></td><td>Обычно Φ = E·S·Kз без коэффициента использования</td><td>Очень грубая прикидка — завышают или занижают в 1,5–2 раза</td></tr>
   <tr><td><b>Этот калькулятор</b></td><td>Метод коэффициента использования, нормы РФ и EN, раскладка, плотность мощности</td><td>Быстрый подбор на стадии концепции и расстановки</td></tr></tbody></table></div></div>`;
}
function lxSet(k,v){const s=lxState();
  if(k==='room'){s.room=v;const r=LX_ROOMS.find(x=>x.id===v);s.wp=r.wp;if(s.norm!=='own')s.E=s.norm==='en'?r.en:r.ru}
  else if(k==='lum'){s.lum=v;const L=LX_LUM.find(x=>x.id===v);s.lm=L.lm;s.w=L.w}
  else s[k]=+v;
  queueSave();
}

let lxT=null;
document.addEventListener('click',e=>{const ln=e.target.closest('[data-lxnorm]');if(ln){const st=lxState();st.norm=ln.dataset.lxnorm;const r=LX_ROOMS.find(x=>x.id===st.room);if(st.norm!=='own')st.E=st.norm==='en'?r.en:r.ru;queueSave();const y=window.scrollY;renderLux();window.scrollTo({top:y})}});
document.addEventListener('change',e=>{const k=e.target.dataset&&e.target.dataset.lx;if(k&&e.target.tagName==='SELECT'){lxSet(k,e.target.value);const y=window.scrollY;renderLux();window.scrollTo({top:y})}});
document.addEventListener('input',e=>{const k=e.target.dataset&&e.target.dataset.lx;if(!k||e.target.tagName!=='INPUT')return;if(e.target.value===''||isNaN(+e.target.value))return;lxSet(k,e.target.value);clearTimeout(lxT);lxT=setTimeout(()=>{const y=window.scrollY;const f=document.activeElement&&document.activeElement.id;renderLux();window.scrollTo({top:y});if(f){const el=document.getElementById(f);el&&el.focus()}},400)});
renderLux();
</script>

</body></html>
